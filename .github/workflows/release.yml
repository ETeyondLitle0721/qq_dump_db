name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的版本 tag'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 统一定义版本号环境变量
      - name: Define Version
        shell: pwsh
        run: |
          $version = "${{ inputs.tag }}"
          if ([string]::IsNullOrEmpty($version)) {
            $version = "${{ github.ref_name }}"
          }
          echo "RELEASE_TAG=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "使用版本号: $version"

      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact
          Copy-Item build/Release/qq_dump_db.exe artifact/
          Copy-Item README.md artifact/
          # 2. 这里的文件名使用统一的环境变量 $env:RELEASE_TAG
          Compress-Archive -Path artifact/* -DestinationPath qq_dump_db-$env:RELEASE_TAG-win-x64.zip
          # 打印出来让你确认文件真的生成了
          Get-ChildItem *.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 3. 上传时也使用统一的环境变量
          tag_name: ${{ env.RELEASE_TAG }}
          files: qq_dump_db-${{ env.RELEASE_TAG }}-win-x64.zip
          generate_release_notes: true