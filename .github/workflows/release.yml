name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的版本 tag'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 统一定义版本号环境变量
      - name: Define Version
        shell: pwsh
        run: |
          $version = "${{ inputs.tag }}"
          if ([string]::IsNullOrEmpty($version)) {
            $version = "${{ github.ref_name }}"
          }
          echo "RELEASE_TAG=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "使用版本号: $version"

      - name: Install SQLite dependency
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:VCPKG_INSTALLATION_ROOT)) {
            throw "VCPKG_INSTALLATION_ROOT is not configured on this runner."
          }
          # Static SQLite + static MSVC runtime: the release artifact is a
          # self-contained application EXE (Windows system DLLs aside).
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install sqlite3:x64-windows-static

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Run C++ contract tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify executable has no SQLite DLL dependency
        shell: pwsh
        run: pwsh -File scripts/verify-static-sqlite.ps1 -Executable build/Release/qq_dump_db.exe

      - name: Smoke test executable
        shell: pwsh
        run: |
          & "build/Release/qq_dump_db.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "--version smoke test failed." }
          & "build/Release/qq_dump_db.exe" --help | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "--help smoke test failed." }

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact
          Copy-Item build/Release/qq_dump_db.exe artifact/
          Copy-Item README.md artifact/
          Copy-Item README.zh-CN.md artifact/
          Copy-Item README.en-US.md artifact/
          if (Test-Path artifact/sqlite3.dll) { throw "sqlite3.dll must not be required or shipped." }
          # 2. 这里的文件名使用统一的环境变量 $env:RELEASE_TAG
          Compress-Archive -Path artifact/* -DestinationPath qq_dump_db-$env:RELEASE_TAG-win-x64.zip
          # 打印出来让你确认文件真的生成了
          Get-ChildItem *.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 3. 上传时也使用统一的环境变量
          tag_name: ${{ env.RELEASE_TAG }}
          files: qq_dump_db-${{ env.RELEASE_TAG }}-win-x64.zip
          generate_release_notes: true