[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qq-dump-db"
version = "2.0.0"
description = "Modular Python implementation of qq_dump_db"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["cryptography>=41"]
license = { text = "MIT" }

[project.scripts]
qq-dump-db = "qq_dump_db.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
